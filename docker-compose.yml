# Chạy local:   docker compose up -d --build
# Production:   docker compose --profile prod up -d --build   (thêm Caddy/TLS; đặt APP_DOMAIN trong .env)
# Bí mật nằm trong .env (không commit). Mẫu: .env.example.

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build: .
  image: peapod-ai:local
  restart: unless-stopped
  logging: *logs
  env_file: .env
  environment:
    DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@postgres:5432/peapod
    NODE_ENV: production
  volumes:
    - media:/data/media
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: peapod
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Chỉ mở cho máy chủ (loopback), không ra Internet. Cổng 5433 để tránh đụng Postgres/SQL Server cục bộ.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d peapod"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "dist/src/server.js"]
    # Không publish cổng ra ngoài; truy cập qua Caddy (prod) hoặc cổng loopback khi dev.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *app
    command: ["node", "dist/src/worker.js"]

  caddy:
    profiles: ["prod"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?đặt APP_DOMAIN khi dùng profile prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
