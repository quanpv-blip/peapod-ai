# CI cho mỗi push và pull request: kiểm kiểu, test (có PostgreSQL thật), build, build Docker image, quét bí mật.
# Test tích hợp chỉ chạy khi có TEST_DATABASE_URL; ở đây luôn có nên không bị bỏ qua âm thầm.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: peapod
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d peapod" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://app:ci-only-password@localhost:5432/peapod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Kiểm tra lỗ hổng phụ thuộc (mức cao)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t peapod-ai:ci .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
